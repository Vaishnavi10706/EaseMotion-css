<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Radial Action Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>CSS-only Radial Action Menu</h1>
    <p>Hover over the center button</p>
    <div class="radial-menu">
        <button class="main-btn">+</button>
        <a href="#" class="action action1">🏠</a>
        <a href="#" class="action action2">❤️</a>
        <a href="#" class="action action3">⭐</a>
        <a href="#" class="action action4">⚙️</a>
        <a href="#" class="action action5">✉️</a>
        <a href="#" class="action action6">📷</a>
    </div>
</div>
</body>
</html>
